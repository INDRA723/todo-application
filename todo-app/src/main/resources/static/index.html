<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e11;
      --surface: #1a1a20;
      --border: #2e2e38;
      --accent: #c8f135;
      --accent-dim: #9db82a;
      --text: #f0f0f0;
      --muted: #888;
      --done: #444;
      --danger: #ff4d4d;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 60px 16px;
    }

    .app {
      width: 100%;
      max-width: 560px;
    }

    header {
      margin-bottom: 40px;
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 3rem;
      line-height: 1;
      letter-spacing: -2px;
    }

    header h1 span {
      color: var(--accent);
    }

    header p {
      color: var(--muted);
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
    }

    .input-row input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      padding: 12px 16px;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: var(--accent);
    }

    .input-row input::placeholder { color: var(--muted); }

    .input-row button {
      background: var(--accent);
      color: #0e0e11;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .input-row button:hover { background: var(--accent-dim); }
    .input-row button:active { transform: scale(0.97); }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .stats span b {
      color: var(--accent);
      font-family: 'Syne', sans-serif;
    }

    #todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      animation: slideIn 0.25s ease;
      transition: border-color 0.2s, opacity 0.2s;
    }

    .todo-item.done {
      opacity: 0.5;
      border-color: transparent;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-check {
      width: 22px; height: 22px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    .todo-check:hover { border-color: var(--accent); }

    .todo-item.done .todo-check {
      background: var(--accent);
      border-color: var(--accent);
    }

    .todo-check svg { display: none; }
    .todo-item.done .todo-check svg { display: block; }

    .todo-title {
      flex: 1;
      font-size: 0.97rem;
      line-height: 1.4;
      transition: text-decoration 0.2s;
    }

    .todo-item.done .todo-title {
      text-decoration: line-through;
      color: var(--done);
    }

    .todo-delete {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      display: flex;
    }

    .todo-delete:hover { color: var(--danger); background: rgba(255,77,77,0.1); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 0;
      font-size: 0.95rem;
    }

    .empty span {
      display: block;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>My <span>Todos</span></h1>
    <p>Stay focused. Get things done.</p>
  </header>

  <div class="input-row">
    <input id="todo-input" type="text" placeholder="What needs to be done?" />
    <button onclick="addTodo()">Add</button>
  </div>

  <div class="stats">
    <span>Total <b id="count-total">0</b></span>
    <span>Done <b id="count-done">0</b></span>
    <span>Pending <b id="count-pending">0</b></span>
  </div>

  <ul id="todo-list"></ul>
</div>

<script>
  const API = '/api/todos';

  async function loadTodos() {
    const res = await fetch(API);
    const todos = await res.json();
    renderTodos(todos);
  }

  function renderTodos(todos) {
    const list = document.getElementById('todo-list');
    list.innerHTML = '';

    if (todos.length === 0) {
      list.innerHTML = `<div class="empty"><span>✓</span>No todos yet. Add one above!</div>`;
    } else {
      todos.forEach(todo => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.completed ? ' done' : '');
        li.innerHTML = `
          <div class="todo-check" onclick="toggleTodo(${todo.id})">
            <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
              <path d="M1 5L4.5 8.5L11 1" stroke="#0e0e11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="todo-title">${escapeHtml(todo.title)}</span>
          <button class="todo-delete" onclick="deleteTodo(${todo.id})" title="Delete">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>`;
        list.appendChild(li);
      });
    }

    // Update stats
    const done = todos.filter(t => t.completed).length;
    document.getElementById('count-total').textContent = todos.length;
    document.getElementById('count-done').textContent = done;
    document.getElementById('count-pending').textContent = todos.length - done;
  }

  async function addTodo() {
    const input = document.getElementById('todo-input');
    const title = input.value.trim();
    if (!title) return;

    await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });

    input.value = '';
    loadTodos();
  }

  async function toggleTodo(id) {
    await fetch(`${API}/${id}/toggle`, { method: 'PATCH' });
    loadTodos();
  }

  async function deleteTodo(id) {
    await fetch(`${API}/${id}`, { method: 'DELETE' });
    loadTodos();
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Allow pressing Enter to add
  document.getElementById('todo-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  // Load todos on page start
  loadTodos();
</script>
</body>
</html>
